[package]
name = "gaia-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { path = "../../.runtime/vendor/rune/crates/rune", default-features = false, features = ["svg"] }
rune-kit = { path = "../../.runtime/vendor/rune/crates/rune-kit" }
rune-theme-opencode = { path = "../../.runtime/vendor/rune/themes/opencode" }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[patch.crates-io]
wgpu-hal = { path = "../../.runtime/vendor/rune/vendor/wgpu-hal" }
winit = { path = "../../.runtime/vendor/rune/vendor/winit" }
parley_engine = { path = "../../.runtime/vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "../../.runtime/vendor/rune/vendor/accesskit_windows" }

[profile.release]
debug = 0
incremental = true
codegen-units = 16

[workspace]
