<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>GAIA | Earth-system analysis</title><link rel="icon" href="/logos/gaia-icon.svg"><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#e9ede0;font-family:system-ui}#startup{padding:40px;display:flex;align-items:center;gap:20px;min-height:160px}#startup img{width:64px;height:64px}#startup small{display:block;color:#a6b5ab;margin-top:8px}canvas{display:block}::selection{background:#7de3bc;color:#000}</style></head>
<body><div id="startup" role="status"><img src="/logos/gaia-icon.svg" alt=""><div>GAIA<small>Opening your investigation workspace…</small></div></div>
<script type="module">
try{
  const {connect}=await import('/rune/bridge.mjs');
  const module=await import('/rune/gaia.js');
  await module.default();
  document.getElementById('startup')?.remove();
  requestAnimationFrame(()=>connect(module.notify));
}catch(error){document.getElementById('startup').textContent=`Rune could not start: ${error.message}. Check WebGPU/WebGL availability and the local build.`;}
</script></body></html>
