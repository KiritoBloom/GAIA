<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="640" viewBox="0 0 1800 640" role="img" aria-labelledby="title description">
  <title id="title">GAIA — Earth-system questions. Traceable evidence.</title>
  <desc id="description">An editorial cover with oversized Geist typography over a NASA/JSC photograph of atmospheric glow above the Pacific Ocean. The photograph is illustrative, not an analyzed GAIA dataset. Independent NASA Space Apps 2026 project.</desc>
  <defs>
    <clipPath id="image-frame"><rect x="8" y="8" width="1784" height="624" rx="18"/></clipPath>
    <linearGradient id="image-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070a" stop-opacity=".52"/>
      <stop offset=".46" stop-color="#03070a" stop-opacity=".1"/>
      <stop offset=".7" stop-color="#03070a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#03070a" stop-opacity=".72"/>
    </linearGradient>
  </defs>
  <rect width="1800" height="640" rx="24" fill="#101619"/>
  <g clip-path="url(#image-frame)">
    <rect x="8" y="8" width="1784" height="624" fill="#03070a"/>
    <image href="earth-horizon.jpg" x="-20" y="-105" width="1840" height="1226.6667" preserveAspectRatio="xMidYMid slice"/>
    <rect x="8" y="8" width="1784" height="624" fill="url(#image-shade)"/>
    <text x="900" y="77" text-anchor="middle" font-family="Geist" font-size="19" font-weight="500" letter-spacing="3.2" fill="#b9c6c6">GEOSPATIAL ANALYSIS &amp; INVESTIGATION ASSISTANT</text>
    <text x="891" y="390" text-anchor="middle" font-family="Geist" font-size="360" font-weight="600" letter-spacing="-17" fill="#f4f6f2">GAIA</text>
    <text x="900" y="468" text-anchor="middle" font-family="Geist" font-size="36" font-weight="400" letter-spacing="-.5" fill="#e0eae6">Earth-system questions. Traceable evidence.</text>
    <text x="76" y="594" font-family="Geist" font-size="16" font-weight="500" letter-spacing="2.1" fill="#a2b1b0">NASA SPACE APPS 2026</text>
    <text x="1724" y="594" text-anchor="end" font-family="Geist" font-size="16" font-weight="500" letter-spacing="2.1" fill="#a2b1b0">INDEPENDENT PROJECT</text>
  </g>
  <path d="M26 8H1774Q1792 8 1792 26" fill="none" stroke="#f0f5f2" stroke-opacity=".12" stroke-width="1"/>
</svg>
