<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Exploration 01 — AURA aerodynamic signal</title>
  <desc id="desc">Three swept titanium-blue air vanes circle a triangular aperture. Fine technical registration marks and an original angular AURA wordmark.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2c"/><stop offset=".6" stop-color="#09101e"/><stop offset="1" stop-color="#050914"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f2f6fa"/><stop offset=".26" stop-color="#b8d7ee"/><stop offset=".46" stop-color="#7298c6"/><stop offset=".73" stop-color="#2a4e80"/><stop offset="1" stop-color="#152540"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#f6fbff"/><stop offset=".5" stop-color="#9dcdef"/><stop offset="1" stop-color="#3d679e"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71a7d5"/><stop offset="1" stop-color="#0a1c36"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#799dbd" stroke-width=".7" opacity=".065"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000" flood-opacity=".32"/></filter>
    <g id="vane">
      <path d="M-34-270C127-285 266-181 266-34C266 39 232 99 190 138C224 74 205 24 160-9C104-50 65-63 15-66H-69C-131-66-176-91-165-139C-151-204-104-251-34-270Z" fill="url(#metal)"/>
      <path d="M-34-270C127-285 266-181 266-34C264 10 251 53 229 87C246 0 213-84 150-136C87-189 24-203-70-191C-112-186-145-164-165-139C-151-204-104-251-34-270Z" fill="url(#edge)" opacity=".75"/>
      <path d="M-165-139C-115-195-24-211 59-184C-50-181-71-140-69-66C-131-66-176-91-165-139Z" fill="url(#fold)"/>
      <path d="M-145-175C-55-257 98-243 191-157" fill="none" stroke="#e4f5ff" stroke-width="1.8" opacity=".75"/>
      <path d="M-69-66H15C65-63 104-50 160-9" fill="none" stroke="#b6d5f2" stroke-width="1.5" opacity=".75"/>
    </g>
  </defs>
  <rect width="1200" height="1200" fill="url(#ground)"/>
  <rect x="100" y="100" width="1000" height="805" fill="url(#grid)"/>
  <g id="emblem">
  <!-- A clipped instrumentation frame, not a decorative orbital badge. -->
  <g fill="none" stroke="#86a8ce" stroke-width="1">
    <path d="M220 263V190H293 M907 190H980V263 M220 777V850H293 M907 850H980V777" opacity=".55"/>
    <path d="M238 237H268 M253 222V252 M932 237H962 M947 222V252 M238 803H268 M253 788V818 M932 803H962 M947 788V818" opacity=".22"/>
    <path d="M600 156V193 M600 843V880 M178 520H215 M985 520H1022" opacity=".36"/>
    <path d="M304 224L342 262 M858 778L896 816 M304 816L342 778 M858 262L896 224" opacity=".18"/>
    <path d="M271 407C319 280 452 214 593 217 M927 658C879 785 746 851 605 848" opacity=".23"/>
    <path d="M325 298L318 310 M342 277L335 289 M364 255L357 267 M826 788L833 776 M848 771L855 759 M869 752L876 740" opacity=".5"/>
  </g>
  <g transform="translate(600 520)" filter="url(#shadow)">
    <use href="#vane"/>
    <use href="#vane" transform="rotate(120)"/>
    <use href="#vane" transform="rotate(240)"/>
  </g>
  <g transform="translate(600 520)" fill="none" stroke="#c6e5fa">
    <path d="M0-51L44 25H-44Z" stroke-width="1.3" opacity=".7"/>
    <path d="M0-68V-88 M59 34L76 44 M-59 34L-76 44" stroke-width="1" opacity=".38"/>
  </g>
  <!-- Thin streamlines explain the vane's air motion without cloud clipart. -->
  <g fill="none" stroke="#7aa4cd" stroke-width="1.2" opacity=".4">
    <path d="M349 312C389 273 441 254 484 258 M332 296C379 252 432 232 486 233"/>
    <path d="M900 438C914 500 904 550 878 590 M924 432C939 504 926 562 898 604"/>
    <path d="M513 814C450 806 410 778 382 739 M507 839C436 829 388 798 361 755"/>
  </g>
  <g fill="#b5cfe8">
    <path d="M198 495H202V503H198Z M198 516H206V524H198Z M198 537H202V545H198Z" opacity=".6"/>
    <path d="M998 495H1002V503H998Z M994 516H1002V524H994Z M998 537H1002V545H998Z" opacity=".6"/>
  </g>
  </g>
  <!-- Bespoke open-counter geometric lettering, entirely outlined in SVG. -->
  <g id="wordmark" transform="translate(392 960)" fill="none" stroke="#d8e7f3" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M0 80L36 0H48L84 80 M20 54H64"/>
    <path d="M116 0V53Q116 82 149 82Q182 82 182 53V0"/>
    <path d="M221 80V0H261Q292 0 292 27Q292 54 261 54H221 M258 54L296 80"/>
    <path d="M332 80L368 0H380L416 80 M352 54H396"/>
  </g>
  <g id="family-seal" transform="translate(600 1110)" fill="none" stroke="#b6c5b2" stroke-width="1" opacity=".65">
    <path d="M0-13V13 M-13 0H13"/><circle r="5"/><circle cy="-16" r="2" fill="#c5e2f7"/><circle cx="16" r="2"/><circle cy="16" r="2"/><circle cx="-16" r="2"/>
  </g>
</svg>
