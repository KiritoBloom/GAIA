<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Exploration 01 — THALASSA carved current</title>
  <desc id="desc">Two interlocking water currents cut from a deep teal disk, with carved parallel wave lines, a mineral-teal print and warm ivory paper. Original serif-like vector lettering.</desc>
  <defs>
    <pattern id="paper" width="127" height="113" patternUnits="userSpaceOnUse">
      <path d="M5 12L31 11 M76 34L114 33 M19 64L52 63 M62 95L95 94 M2 98L14 97 M93 8L105 7" fill="none" stroke="#7b7763" stroke-width=".6" opacity=".13"/>
      <path d="M12 40L18 42 M51 20L57 21 M92 75L99 76 M31 100L35 101" fill="none" stroke="#fffdf2" stroke-width="1" opacity=".65"/>
    </pattern>
    <clipPath id="disk"><circle cx="600" cy="514" r="313"/></clipPath>
    <pattern id="ink" width="86" height="57" patternUnits="userSpaceOnUse"><path d="M0 16L62 8 M11 43L86 33" stroke="#d7e4d2" stroke-width=".65" opacity=".07" fill="none"/></pattern>
  </defs>
  <rect width="1200" height="1200" fill="#0d1c1b"/>
  <rect width="1200" height="1200" fill="url(#paper)" opacity=".13"/>
  <path d="M130 147H1070" fill="none" stroke="#a6bdac" stroke-width=".7" opacity=".23"/>
