      <path d="M600 383C582 345 577 303 600 269 M600 352C588 332 575 320 560 312 M601 332C617 315 630 305 645 300" fill="none" stroke="#3c613d" stroke-width="1.4"/>
      <path d="M576 278C556 304 567 338 582 358" fill="none" stroke="#e5e3b9" stroke-width="1.1" opacity=".6"/>
    </g>
    <clipPath id="left-leaf"><path d="M600 717C481 685 371 557 382 415C480 439 552 520 577 621C587 661 597 692 600 717Z"/></clipPath>
    <clipPath id="right-leaf"><path d="M608 655C696 646 813 545 825 411C724 424 663 476 638 557C625 597 617 630 608 655Z"/></clipPath>
  </defs>
  <rect width="1200" height="1200" fill="url(#ground)"/>
  <rect width="1200" height="1200" fill="url(#grain)"/>
