<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Exploration 01 — CHLORIS botanical reliquary</title>
  <desc id="desc">A five-petaled flower, engraved asymmetrical leaves and branching roots inside a gilded Art Nouveau arch. Sage and antique gold on dark olive, with original serif vector lettering.</desc>
  <defs>
    <radialGradient id="ground" cx="50%" cy="43%" r="73%"><stop stop-color="#233226"/><stop offset=".55" stop-color="#142018"/><stop offset="1" stop-color="#0b130e"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#dcca8b"/><stop offset=".45" stop-color="#8e814c"/><stop offset=".72" stop-color="#c5b57c"/><stop offset="1" stop-color="#6e6b40"/></linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8cb99"/><stop offset=".55" stop-color="#86a375"/><stop offset="1" stop-color="#435f43"/></linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4d7a5"/><stop offset=".4" stop-color="#acbe8d"/><stop offset="1" stop-color="#56784c"/></linearGradient>
    <pattern id="grain" width="91" height="89" patternUnits="userSpaceOnUse"><path d="M11 19H35 M49 50H70 M6 77H14 M69 8H80" stroke="#d3cd98" stroke-width=".5" opacity=".045"/></pattern>
    <g id="petal-shape">
